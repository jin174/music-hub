<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Music Hub · 动态灵动岛</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000000;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    /* 真正极致纤薄的灵动岛药丸卡片 */
    .island {
      width: 100%;
      height: 100%;
      background: #0a0d14;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 5px 12px 5px 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.12);
      position: relative;
    }

    /* 黑胶唱片 / 专辑封面 */
    .cover-disc {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .cover-disc.spinning img {
      animation: spin 16s linear infinite;
    }
    .cover-disc img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .cover-fallback {
      font-size: 16px;
      color: #8b949e;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 中间曲目与进度 */
    .center-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      justify-content: center;
    }
    .meta-line {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
    }
    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .track-artist {
      font-size: 11px;
      color: #8b949e;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 律动音波小动画 */
    .sound-wave {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      flex-shrink: 0;
    }
    .sound-wave span {
      width: 2px;
      background: #56d364;
      border-radius: 1px;
      animation: wave 0.8s ease-in-out infinite alternate;
    }
    .sound-wave span:nth-child(1) { height: 3px; animation-delay: 0.1s; }
    .sound-wave span:nth-child(2) { height: 9px; animation-delay: 0.3s; }
    .sound-wave span:nth-child(3) { height: 5px; animation-delay: 0.2s; }
    @keyframes wave {
      0% { height: 2px; }
      100% { height: 10px; }
    }

    /* 进度条与时间 */
    .progress-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prog-track {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff7b72, #e84142);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .time-lbl {
      font-size: 9px;
      color: #8b949e;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* 右侧单排水平微按钮 */
    .actions-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .pill-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #8b949e;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s ease;
      padding: 0;
      line-height: 1;
    }
    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.08);
    }
    .pill-btn.active-like {
      background: rgba(46, 160, 67, 0.3);
      border-color: #2ea043;
      color: #56d364;
    }
    .pill-btn.active-dislike {
      background: rgba(232, 65, 66, 0.3);
      border-color: #e84142;
      color: #e84142;
    }

    .toast {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.2s ease;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show {
      top: 6px;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="island">
    <!-- 左侧微缩黑胶封面 -->
    <div class="cover-disc" id="coverDisc">
      <img id="coverImg" src="" style="display:none;">
      <span id="coverFallback" class="cover-fallback">♪</span>
    </div>

    <!-- 中间信息与极细进度 -->
    <div class="center-content">
      <div class="meta-line">
        <span class="track-title" id="trackTitle">等待播放曲目...</span>
        <span style="color:#6e7681; font-size:10px;">·</span>
        <span class="track-artist" id="trackArtist">打开任意音乐软件</span>
        <div class="sound-wave" id="soundWave" style="display:none;">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="progress-line">
        <div class="prog-track">
          <div class="prog-fill" id="progFill"></div>
        </div>
        <span class="time-lbl" id="timeText">00:00 / 00:00</span>
      </div>
    </div>

    <!-- 右侧水平微图标组 -->
    <div class="actions-strip">
      <button class="pill-btn" id="likeBtn" title="👍 喜欢" onclick="toggleMiniFeedback('like')">👍</button>
      <button class="pill-btn" id="dislikeBtn" title="🚫 避雷" onclick="toggleMiniFeedback('dislike')">🚫</button>
      <button class="pill-btn" id="playBtn" title="▶ 客户端开播" onclick="replayClient()">▶</button>
      <button class="pill-btn" title="⤢ 打开控制台" onclick="openMainConsole()">⤢</button>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    let curState = null;
    let localPlayedMs = 0;
    let isPlaying = false;
    let durMs = 0;

    function fmtTime(ms) {
      if (!ms || ms < 0) return '00:00';
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = 'toast show';
      setTimeout(() => t.className = 'toast', 1500);
    }

    async function poll() {
      try {
        const res = await fetch('/api/state');
        const st = await res.json();
        curState = st;
        render(st);
      } catch (e) {}
    }

    function render(st) {
      const now = st.now;
      const disc = document.getElementById('coverDisc');
      const coverImg = document.getElementById('coverImg');
      const coverFb = document.getElementById('coverFallback');
      const titleEl = document.getElementById('trackTitle');
      const artistEl = document.getElementById('trackArtist');
      const wave = document.getElementById('soundWave');

      if (!now) {
        disc.className = 'cover-disc';
        coverImg.style.display = 'none';
        coverFb.style.display = 'inline';
        titleEl.innerText = '等待音乐开播...';
        artistEl.innerText = '网易云/QQ/汽水音乐等';
        wave.style.display = 'none';
        isPlaying = false;
        durMs = 0;
        localPlayedMs = 0;
        updateProgress();
        return;
      }

      isPlaying = Boolean(now.playing);
      disc.className = isPlaying ? 'cover-disc spinning' : 'cover-disc';
      wave.style.display = isPlaying ? 'inline-flex' : 'none';

      titleEl.innerText = now.title || '未知曲目';
      artistEl.innerText = now.artist || '未知歌手';

      if (now.cover) {
        coverImg.src = now.cover + '?param=80y80';
        coverImg.style.display = 'block';
        coverFb.style.display = 'none';
      } else {
        coverImg.style.display = 'none';
        coverFb.style.display = 'inline';
      }

      durMs = now.duration_ms || 0;
      localPlayedMs = now.played_ms || 0;
      updateProgress();
    }

    function updateProgress() {
      const fill = document.getElementById('progFill');
      const timeText = document.getElementById('timeText');
      timeText.innerText = `${fmtTime(localPlayedMs)} / ${fmtTime(durMs)}`;
      if (durMs > 0) {
        const pct = Math.min(100, Math.max(0, (localPlayedMs / durMs) * 100));
        fill.style.width = pct.toFixed(1) + '%';
      } else {
        fill.style.width = isPlaying ? '40%' : '0%';
      }
    }

    setInterval(() => {
      if (isPlaying && durMs > 0 && localPlayedMs < durMs) {
        localPlayedMs += 1000;
        updateProgress();
      }
    }, 1000);

    async function toggleMiniFeedback(action) {
      const now = curState?.now;
      if (!now || !now.title) return showToast('未在放歌');
      const btn = action === 'like' ? document.getElementById('likeBtn') : document.getElementById('dislikeBtn');
      const isCur = btn.classList.contains(action === 'like' ? 'active-like' : 'active-dislike');
      const act = isCur ? 'remove' : action;
      try {
        const res = await (await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: now.title, artist: now.artist, action: act })
        })).json();
        if (res.ok) {
          if (act === 'like') {
            btn.className = 'pill-btn active-like';
            document.getElementById('dislikeBtn').className = 'pill-btn';
            showToast('已标记 👍 喜欢');
          } else if (act === 'dislike') {
            btn.className = 'pill-btn active-dislike';
            document.getElementById('likeBtn').className = 'pill-btn';
            showToast('已加入 🚫 避雷');
          } else {
            btn.className = 'pill-btn';
            showToast('已取消标记');
          }
        }
      } catch (e) {
        showToast('请求失败');
      }
    }

    async function replayClient() {
      const now = curState?.now;
      if (!now || !now.ncm_id) return showToast('未匹配到网易云ID');
      await fetch('/api/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: now.ncm_id })
      });
      showToast('已在客户端播放');
    }

    function openMainConsole() {
      if (window.opener) {
        window.opener.focus();
      } else {
        window.open('/', '_blank');
      }
    }

    poll();
    setInterval(poll, 1200);
  </script>
</body>
</html>
